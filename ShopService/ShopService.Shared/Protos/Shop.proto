syntax = "proto3";

option csharp_namespace = "ShopService.Shared.Protos.GrpcShopService";
package shop;


service ShopService {
  rpc GetShopById(GetShopByIdRequest) returns (GetShopByIdResponse);
}

message GetShopByIdRequest {
  string shopId = 1;
}

message GetShopByIdResponse {
  string Id = 1;
}


